name: CodeQL Scheduled

on:
  schedule:
    - cron: '45 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-scheduled
  cancel-in-progress: false

jobs:
  analyze:
    name: Scheduled analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gradle
        if: matrix.language == 'java-kotlin'
        with:
          cache-disabled: 'true'
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Compile analysis targets
        if: matrix.build-mode == 'manual'
        run: ./gradlew ciCodeql --no-build-cache --no-daemon
      - uses: github/codeql-action/analyze@v4
        with:
          category: /schedule/language:${{ matrix.language }}
          wait-for-processing: true
